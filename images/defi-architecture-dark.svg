<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<title>Palliora DeFi in layers</title>
<desc>Applications and the SDK sit on top. A shielded account and proof builder on your device make each transaction. A bundler or relayer submits it to the pool contract, which holds the commitment tree, the address tree, the nullifiers and the verifiers. Adaptors connect the pool to other protocols. A disclosure network of a revoker and Decom guardians can de-anonymize one transaction together. The revoker keeps what it de-anonymized on Palliora Core, in encrypted form.</desc>
