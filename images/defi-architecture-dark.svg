rif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Trade on Hyperliquid</text><rect x="24" y="132" width="636" height="84" rx="8" fill="#1E1D18" stroke="#55554A" stroke-width="1.5"/><g transform="translate(42,146) scale(0.5833333333333334)" fill="none" stroke="#AFAFA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-6" y="-1" width="12" height="10" rx="2"/><path d="M-3.5,-1 V-4 C-3.5,-7.5 3.5,-7.5 3.5,-4 V-1"/></g><text x="56" y="150" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#7A7A6E" text-anchor="start" letter-spacing="0.04em">YOUR DEVICE</text><rect x="40" y="166" width="294" height="40" rx="6" fill="#1C3B33" stroke="#55554A" stroke-width="1"/><text x="187" y="183" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Shielded account</text><text x="187" y="196" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Sign key, view key, notes</text><rect x="350" y="166" width="294" height="40" rx="6" fill="#1C3B33" stroke="#55554A" stroke-width="1"/><text x="497" y="183" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Proof builder</text><text x="497" y="196" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Makes the zero-knowledge proof</text><rect x="24" y="240" width="636" height="84" rx="8" fill="#1E1D18" stroke="#55554A" stroke-width="1.5"/><g transform="translate(42,254) scale(0.5833333333333334)" fill="none" stroke="#AFAFA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-4" width="9" height="8" rx="4"/><rect x="0" y="-4" width="9" height="8" rx="4"/></g><text x="56" y="258" font-family="-apple-system, 'Segoe UI', Arial, s