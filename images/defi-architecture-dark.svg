33333333331" y="464" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">One per transaction shape</text><rect x="246.66666666666666" y="434" width="190.66666666666666" height="40" rx="6" fill="#2B331F" stroke="#55554A" stroke-width="1"/><text x="342" y="451" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Screener</text><text x="342" y="464" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Sanctions check, Ethereum</text><rect x="453.3333333333333" y="434" width="190.66666666666666" height="40" rx="6" fill="#2B331F" stroke="#55554A" stroke-width="1"/><text x="548.6666666666666" y="451" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Revoker registry</text><text x="548.6666666666666" y="464" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Keys the notes are tied to</text><defs><marker id="k-8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M342,108 L342,132" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-8)"/><defs><marker id="k-9" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M342,216 L342,240" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-9)"/><defs><marker id="k-10" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#4FBE9E" stroke-width="1.2"/></marker></defs><path d="M342,324 L342,348" fill="none" stroke="#4FBE9E" stroke-width="2" marker-end="url(#k-10