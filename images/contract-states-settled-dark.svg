<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBD5"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBD5"/></marker></defs><rect x="0" y="0" width="1000" height="360" fill="#1E1D18"/><text x="40" y="38" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">COMPUTE CONTRACT STATES</text><text x="40" y="64" font-family="Inter" font-size="22" font-weight="700" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Every contract moves in one direction</text><rect x="40" y="100" width="200" height="100" rx="12" ry="12" fill="#262419" stroke="#ECEBD5" stroke-width="1.5"/><text x="54" y="124" font-family="Inter" font-size="17" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Dormant</text><text x="54" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">proposed</text><text x="54" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">no guardians, no fees</text><path d="M 244 150 L 276 150" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><rect x="280" y="100" width="200" height="100" rx="12" ry="12" fill="#2B331F" stroke="#ECEBD5" stroke-width="1.5"/><text x="294" y="124" font-family="Inter" font-size="17" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Active</text><text x="294" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">guardians signed</text><text x="294" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">fees locked, Agreement ID</text><path d="M 484 150 L 516 150" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><rect x="520" y="100" width="200" height="100" rx="12" ry="12" fill="#1C3B33" stroke="#ECEBD5" stroke-width="1.5"/><text x="534" y="124" font-family="Inter" font-size="17" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Execute</text><text x="534" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">compute request in</text><text x="534" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">running / being verified</text><path d="M 724 150 L 756 150" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><rect x="760" y="100" width="200" height="100" rx="12" ry="12" fill="#3A2A1C" stroke="#ECEBD5" stroke-width="1.5"/><text x="774" y="124" font-family="Inter" font-size="17" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Settled</text><text x="774" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">fees released</text><text x="774" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">unused balance refunded</text><path d="M 530 204 L 530 250 L 370 250 L 370 204" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><text x="450" y="272" font-family="Inter" font-size="11.5" font-weight="400" text-anchor="middle" fill="#ECEBD5" letter-spacing="0" style="">Subscription: invoke again with fresh input</text><text x="40" y="320" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#AFAFA0" letter-spacing="0" style="font-style:italic;">Subscription contracts loop between Active and Execute until the budget runs out or the deadline passes.</text><text x="40" y="340" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#AFAFA0" letter-spacing="0" style="font-style:italic;">If a job exceeds its budget, the default policy stops it and returns an error.  [TODO: refund rule in that case]</text></svg>