<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="0" y="0" width="1000" height="360" fill="#FEFEF3"/><text x="40" y="38" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">PRIVACY, STAGE BY STAGE</text><text x="40" y="64" font-family="Inter" font-size="22" font-weight="700" text-anchor="start" fill="#222222" letter-spacing="0" style="">No single party holds readable data from start to finish</text><rect x="40" y="96" width="168" height="170" rx="12" ry="12" fill="#E1F5EE" stroke="#222222" stroke-width="1.5"/><text x="54" y="116" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">PUBLISHER</text><text x="54" y="137" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">1 · Publish</text><text x="54" y="155.6" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style=""></text><text x="54" y="171.8" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">encrypted to a</text><text x="54" y="188.0" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">Guardian group&#x27;s key</text><text x="54" y="204.2" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">before it leaves</text><path d="M 210 181 L 226 181" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="228" y="96" width="168" height="170" rx="12" ry="12" fill="#E1F5EE" stroke="#222222" stroke-width="1.5"/><text x="242" y="116" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">ENCRYPTED DA</text><text x="242" y="137" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">2 · Store</text><text x="242" y="155.6" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style=""></text><text x="242" y="171.8" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">sharded and</text><text x="242" y="188.0" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">committed; storage</text><text x="242" y="204.2" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">never sees plaintext</text><path d="M 398 181 L 414 181" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="416" y="96" width="168" height="170" rx="12" ry="12" fill="#EAF3DE" stroke="#222222" stroke-width="1.5"/><text x="430" y="116" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">GUARDIAN QUORUM</text><text x="430" y="137" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">3 · Decrypt</text><text x="430" y="155.6" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style=""></text><text x="430" y="171.8" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">releases the key for</text><text x="430" y="188.0" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">this run only, when</text><text x="430" y="204.2" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">contract terms are met</text><path d="M 586 181 L 602 181" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="604" y="96" width="168" height="170" rx="12" ry="12" fill="#EEEDFE" stroke="#222222" stroke-width="1.5"/><text x="618" y="116" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">COMPUTE NODE</text><text x="618" y="137" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">4 · Compute</text><text x="618" y="155.6" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style=""></text><text x="618" y="171.8" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">trusted, or sealed</text><text x="618" y="188.0" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">in a TEE; SMPC / FHE</text><text x="618" y="204.2" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">on the roadmap</text><path d="M 774 181 L 790 181" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="792" y="96" width="168" height="170" rx="12" ry="12" fill="#FAE8D8" stroke="#222222" stroke-width="1.5"/><text x="806" y="116" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">RETRIEVER</text><text x="806" y="137" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">5 · Output</text><text x="806" y="155.6" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style=""></text><text x="806" y="171.8" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">result re-encrypted</text><text x="806" y="188.0" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">to the retriever&#x27;s</text><text x="806" y="204.2" font-family="Inter" font-size="12" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">key</text><text x="40" y="306" font-family="Inter" font-size="13" font-weight="400" text-anchor="start" fill="#666660" letter-spacing="0" style="font-style:italic;">Every stage runs under a Compute Contract. Disclosure of a specific record is possible only</text><text x="40" y="326" font-family="Inter" font-size="13" font-weight="400" text-anchor="start" fill="#666660" letter-spacing="0" style="font-style:italic;">through accountable privacy: a signed, publicly logged request approved by a Guardian quorum.</text></svg>