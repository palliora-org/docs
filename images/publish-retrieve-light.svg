est + pay</text><path d="M 614 175 L 746 175" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="633.14" y="184.5" width="93.72000000000001" height="17.5" fill="#FEFEF3" rx="3"/><text x="680" y="196" font-family="Inter" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222222" letter-spacing="0" style="">scoped result</text><text x="40" y="260" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#666660" letter-spacing="0" style="font-style:italic;">The publisher is paid automatically at settlement.  [TODO: publisher share of the fee]</text></svg>