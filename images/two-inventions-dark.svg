<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBD5"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBD5"/></marker></defs><rect x="0" y="0" width="1000" height="470" fill="#1E1D18"/><text x="40" y="38" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">THE PRIVATE COMPUTER FOR THE OPEN INTERNET</text><text x="40" y="66" font-family="Inter" font-size="24" font-weight="700" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Two inventions</text><rect x="40" y="92" width="445" height="170" rx="12" ry="12" fill="#2A2740" stroke="#ECEBD5" stroke-width="1.5"/><text x="54" y="112" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">AGREE AND RECORD</text><text x="54" y="133" font-family="Inter" font-size="18" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Compute Contracts</text><text x="54" y="153.925" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">A public agreement for every computation:</text><text x="54" y="172.15" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">what runs, on whose data, under what</text><text x="54" y="190.375" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">confidentiality, and who gets paid.</text><text x="54" y="208.60000000000002" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Terms locked before anything runs.</text><text x="54" y="226.82500000000002" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Every step recorded.</text><rect x="515" y="92" width="445" height="170" rx="12" ry="12" fill="#1C3B33" stroke="#ECEBD5" stroke-width="1.5"/><text x="529" y="112" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">SEAL AND DISCLOSE</text><text x="529" y="133" font-family="Inter" font-size="18" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Accountable Privacy</text><text x="529" y="153.925" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Data and identities stay sealed by default.</text><text x="529" y="172.15" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">A specific record is revealed only through</text><text x="529" y="190.375" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">due process: a signed, publicly logged</text><text x="529" y="208.60000000000002" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">request, approved by a Guardian quorum.</text><text x="529" y="226.82500000000002" font-family="Inter" font-size="13.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">No master key.</text><path d="M 262 266 L 262 300" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 737 266 L 737 300" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><text x="40" y="322" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">DELIVERED BY</text><rect x="40" y="334" width="445" height="64" rx="12" ry="12" fill="#2B331F" stroke="#ECEBD5" stroke-width="1.5"/><text x="54" y="358" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Guardian network</text><text x="54" y="377.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">independent nodes hold key shares, run and approve</text><rect x="515" y="334" width="445" height="64" rx="12" ry="12" fill="#2B331F" stroke="#ECEBD5" stroke-width="1.5"/><text x="529" y="358" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Encrypted Data Availability</text><text x="529" y="377.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">anyone can check it exists; no one can read it alone</text><rect x="40" y="414" width="920" height="40" rx="12" ry="12" fill="#3A2A1C" stroke="#ECEBD5" stroke-width="1.5"/><text x="500" y="440" font-family="Inter" font-size="16" font-weight="600" text-anchor="middle" fill="#ECEBD5" letter-spacing="0" style="">Private by default. Accountable by design.</text></svg>