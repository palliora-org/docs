<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBD5"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBD5"/></marker></defs><rect x="0" y="0" width="1000" height="450" fill="#1E1D18"/><text x="40" y="38" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">PALLIORA DEFI</text><text x="40" y="64" font-family="Inter" font-size="22" font-weight="700" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Private trading on any chain, accountable to regulators</text><rect x="40" y="100" width="240" height="120" rx="12" ry="12" fill="#262419" stroke="#ECEBD5" stroke-width="1.5"/><text x="54" y="124" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Platform or front end</text><text x="54" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">exchange, broker, wallet</text><text x="54" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">or trading app plugs in</text><text x="54" y="177.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">the Palliora DeFi SDK</text><rect x="350" y="100" width="290" height="120" rx="12" ry="12" fill="#1C3B33" stroke="#ECEBD5" stroke-width="1.5"/><text x="364" y="124" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Trader&#x27;s activity, private</text><text x="364" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">positions, history and</text><text x="364" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">strategy sealed by default</text><text x="364" y="177.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">assets stay on their chain</text><rect x="710" y="100" width="250" height="120" rx="12" ry="12" fill="#1E1D18" stroke="#ECEBD5" stroke-width="1.5"/><text x="724" y="124" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Venue, on any chain</text><text x="724" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">orders and settlement</text><text x="724" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">as usual; who placed</text><text x="724" y="177.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">them stays private</text><path d="M 284 160 L 346 160" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 644 160 L 706 160" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><rect x="350" y="262" width="610" height="100" rx="12" ry="12" fill="#2B331F" stroke="#ECEBD5" stroke-width="1.5"/><text x="370" y="287" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">PALLIORA</text><text x="370" y="312" font-family="Inter" font-size="13" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Guardians hold the disclosure keys. A specific record is revealed</text><text x="370" y="332" font-family="Inter" font-size="13" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">only by due process: a logged request approved by a quorum.</text><text x="370" y="352" font-family="Inter" font-size="13" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Traders can share time-bound view keys for tax and audit.</text><path d="M 495 224 L 495 258" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arrs)"/><rect x="40" y="262" width="240" height="100" rx="12" ry="12" fill="#2A2740" stroke="#ECEBD5" stroke-width="1.5"/><text x="54" y="286" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Regulators</text><text x="54" y="305.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">get answers through</text><text x="54" y="322.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">due process, not</text><text x="54" y="339.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">blanket surveillance</text><path d="M 346 312 L 284 312" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><text x="40" y="400" font-family="Inter" font-size="13" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Palliora DeFi never takes custody of users&#x27; assets. Privacy applies to the data, not the assets.</text><text x="40" y="424" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#AFAFA0" letter-spacing="0" style="font-style:italic;">Vaults are live on testnet. About 1 basis point per trade.</text></svg>