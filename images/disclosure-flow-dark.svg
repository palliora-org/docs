<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<title>De-anonymizing one transaction</title>
<desc>Swim-lane sequence across the revoker, the public request record and the Decom guardians. The revoker creates a request that names one transaction, and it is recorded publicly. The revoker sends a signed request to each guardian. Each guardian checks it and returns a partial decryption directly. The revoker combines a threshold of partial decryptions with its own key to recover the seed, then reads the transaction's memo.</desc>
<line x1="16" y1="76" x2="944" y2="76" stroke="#55554A" stroke-width="0.75" stroke-dasharray="2,3"/><g transform="translate(30,63) scale(0.5833333333333334)" fill="none" stroke="#AFAFA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-5" r="3.2"/><line x1="-2.7" y1="-2.7" x2="7" y2="7"/><line x1="3" y1="3" x2="3" y2="7"/><line x1="6" y1="6" x2="9" y2="3"/></g><text x="44" y="68" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#AFAFA0" text-anchor="start">Revoker</text><line x1="16" y1="206" x2="944" y2="206" stroke="#55554A" stroke-width="0.75" stroke-dasharray="2,3"/><g transform="translate(30,193) scale(0.5833333333333334)" fill="none" stroke="#AFAFA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,-9 H3 L7,-5 V9 H-6 Z"/><path d="M3,-9 V-5 H7"/><path d="M-3,1 L-0.5,3.5 L4,-1.5"/></g><text x="44" y="198" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#AFAFA0" text-anchor="start">Public request record</text><line x1="16" y1="336" x2="944" y2="336" stroke="#55554A" stroke-width="0.75" stroke-dasharray="2,3"/><g transform="translate(30,323) scale(0.5833333333333334)" fill="none" stroke="#AFAFA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-2" r="4.5"/><circle cx="5" cy="-2" r="4.5"/><circle cx="0" cy="5.5" r="4.5"/></g><text x="44" y="328" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#AFAFA0" text-anchor="start">Decom guardians</text><line x1="16" y1="466" x2="944" y2="466" stroke="#55554A" stroke-width="0.75" stroke-dasharray="2,3"/><defs><marker id="k-6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M200,173 L200,213" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-6)"/><defs><marker id="k-7" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M270,270 L350,270 L350,173" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-7)"/><defs><marker id="k-8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M380,173 L380,343" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-8)"/><defs><marker id="k-9" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M450,400 L520,400" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-9)"/><defs><marker id="k-10" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M660,400 L790,400 L790,173" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-10)"/><rect x="130" y="107" width="140" height="66" rx="6" fill="#2A2740" stroke="#55554A" stroke-width="1"/><text x="200" y="137" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Create request</text><text x="200" y="150" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Names one transaction</text><circle cx="200" cy="96" r="11" fill="#4FBE9E"/><text x="200" y="100" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#121212" text-anchor="middle">1</text><rect x="130" y="237" width="140" height="66" rx="6" fill="#3A2A1C" stroke="#55554A" stroke-width="1"/><text x="200" y="267" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Recorded</text><text x="200" y="280" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Anyone can see the request</text><circle cx="200" cy="226" r="11" fill="#4FBE9E"/><text x="200" y="230" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#121212" text-anchor="middle">2</text><rect x="310" y="107" width="140" height="66" rx="6" fill="#2A2740" stroke="#55554A" stroke-width="1"/><text x="380" y="131" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Ask each guardian</text><text x="380" y="144" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Signed request, sent</text><text x="380" y="155" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">directly</text><circle cx="380" cy="96" r="11" fill="#4FBE9E"/><text x="380" y="100" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#121212" text-anchor="middle">3</text><rect x="310" y="367" width="140" height="66" rx="6" fill="#1C3B33" stroke="#55554A" stroke-width="1"/><text x="380" y="391" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Check the request</text><text x="380" y="404" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Fresh, public, registered</text><text x="380" y="415" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">revoker, active group</text><circle cx="380" cy="356" r="11" fill="#4FBE9E"/><text x="380" y="360" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#121212" text-anchor="middle">4</text><rect x="520" y="367" width="140" height="66" rx="6" fill="#1C3B33" stroke="#55554A" stroke-width="1"/><text x="590" y="391" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Partial decryption</text><text x="590" y="404" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Returned directly, never</text><text x="590" y="415" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">published</text><circle cx="590" cy="356" r="11" fill="#4FBE9E"/><text x="590" y="360" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#121212" text-anchor="middle">5</text><rect x="720" y="107" width="140" height="66" rx="6" fill="#2A2740" stroke="#55554A" stroke-width="1"/><text x="790" y="131" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ECEBD5" text-anchor="middle">Combine and read</text><text x="790" y="144" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Partials and the revoker's</text><text x="790" y="155" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">key decrypt the memo</text><circle cx="790" cy="96" r="11" fill="#4FBE9E"/><text x="790" y="100" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#121212" text-anchor="middle">6</text><rect x="110" y="482" width="740" height="40" rx="8" fill="#262419" stroke="#4FBE9E" stroke-width="1.25"/><text x="480" y="499" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#4FBE9E" text-anchor="middle" letter-spacing="0.03em">NEITHER HALF WORKS ALONE: THE GUARDIANS HOLD ONE HALF OF THE KEY AND THE REVOKER HOLDS THE OTHER</text><text x="480" y="513" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#AFAFA0" text-anchor="middle">Nothing the guardians send is posted on the network. A request for a deactivated group is refused.</text>
</svg>
