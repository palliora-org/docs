<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<title>Keeping a de-anonymized transaction on Palliora</title>
<desc>Swim-lane sequence across the revoker's browser, Palliora Core and a reader. The revoker de-anonymizes a transaction with the Decom guardians, seals a report to the reader's key, which is its own by default, and publishes it to Palliora as an encrypted contract paid in PALI. Palliora keeps it with Data Availability and a Guardian group. Later the revoker requests a grant that names the key to receive it. The Guardians release the key wrapped to that key, and the reader opens the report and runs four checks.</desc>
<line x1="16" y1="76" x2="944" y2="76" stroke="#999990" stroke-width="0.75" stroke-dasharray="2,3"/><g transform="translate(30,63) scale(0.5833333333333334)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-5" r="3.2"/><line x1="-2.7" y1="-2.7" x2="7" y2="7"/><line x1="3" y1="3" x2="3" y2="7"/><line x1="6" y1="6" x2="9" y2="3"/></g><text x="44" y="68" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#666660" text-anchor="start">Revoker, in the browser</text><line x1="16" y1="206" x2="944" y2="206" stroke="#999990" stroke-width="0.75" stroke-dasharray="2,3"/><g transform="translate(30,193) scale(0.5833333333333334)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-5" rx="8" ry="2.6"/><path d="M-8,-5 V2 C-8,3.4 -4.4,4.6 0,4.6 C4.4,4.6 8,3.4 8,2 V-5"/><path d="M-8,-1.5 C-8,-0.1 -4.4,1 0,1 C4.4,1 8,-0.1 8,-1.5"/></g><text x="44" y="198" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#666660" text-anchor="start">Palliora Core</text><line x1="16" y1="336" x2="944" y2="336" stroke="#999990" stroke-width="0.75" stroke-dasharray="2,3"/><g transform="translate(30,323) scale(0.5833333333333334)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-5" r="3.2"/><path d="M-6,7 C-6,1 6,1 6,7" /></g><text x="44" y="328" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#666660" text-anchor="start">Reader: revoker or granted third party</text><line x1="16" y1="466" x2="944" y2="466" stroke="#999990" stroke-width="0.75" stroke-dasharray="2,3"/><defs><marker id="k-1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M270,140 L300,140" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-1)"/><defs><marker id="k-2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M370,173 L370,213" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-2)"/><defs><marker id="k-3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M440,270 L470,270" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-3)"/><defs><marker id="k-4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M610,270 L680,270 L680,173" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-4)"/><defs><marker id="k-5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M700,173 L700,270 L780,270" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-5)"/><defs><marker id="k-6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M850,303 L850,343" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-6)"/><rect x="130" y="107" width="140" height="66" rx="6" fill="#EEEDFE" stroke="#999990" stroke-width="1"/><text x="200" y="131" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222222" text-anchor="middle">De-anonymize</text><text x="200" y="144" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">The transaction, with the</text><text x="200" y="155" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">Decom guardians</text><circle cx="200" cy="96" r="11" fill="#0F6E56"/><text x="200" y="100" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><rect x="300" y="107" width="140" height="66" rx="6" fill="#EEEDFE" stroke="#999990" stroke-width="1"/><text x="370" y="137" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222222" text-anchor="middle">Seal the report</text><text x="370" y="150" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">To the reader's key</text><circle cx="370" cy="96" r="11" fill="#0F6E56"/><text x="370" y="100" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><rect x="300" y="237" width="140" height="66" rx="6" fill="#E1F5EE" stroke="#999990" stroke-width="1"/><text x="370" y="261" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222222" text-anchor="middle">Publish</text><text x="370" y="274" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">Encrypted contract, paid</text><text x="370" y="285" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">in PALI</text><circle cx="370" cy="226" r="11" fill="#0F6E56"/><text x="370" y="230" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><rect x="470" y="237" width="140" height="66" rx="6" fill="#E1F5EE" stroke="#999990" stroke-width="1"/><text x="540" y="261" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222222" text-anchor="middle">Keep it</text><text x="540" y="274" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">Data Availability and a</text><text x="540" y="285" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">Guardian group</text><circle cx="540" cy="226" r="11" fill="#0F6E56"/><text x="540" y="230" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><rect x="630" y="107" width="140" height="66" rx="6" fill="#EEEDFE" stroke="#999990" stroke-width="1"/><text x="700" y="137" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222222" text-anchor="middle">Request a grant</text><text x="700" y="150" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">Names the receiving key</text><circle cx="700" cy="96" r="11" fill="#0F6E56"/><text x="700" y="100" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><rect x="780" y="237" width="140" height="66" rx="6" fill="#E1F5EE" stroke="#999990" stroke-width="1"/><text x="850" y="261" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222222" text-anchor="middle">Release the key</text><text x="850" y="274" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">Guardians wrap it to the</text><text x="850" y="285" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">reader</text><circle cx="850" cy="226" r="11" fill="#0F6E56"/><text x="850" y="230" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text><rect x="780" y="367" width="140" height="66" rx="6" fill="#FAE8D8" stroke="#999990" stroke-width="1"/><text x="850" y="397" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222222" text-anchor="middle">Open and check</text><text x="850" y="410" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">Four checks pass</text><circle cx="850" cy="356" r="11" fill="#0F6E56"/><text x="850" y="360" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">7</text><rect x="110" y="482" width="740" height="40" rx="8" fill="#F3F2DE" stroke="#0F6E56" stroke-width="1.25"/><text x="480" y="499" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#0F6E56" text-anchor="middle" letter-spacing="0.03em">SEALED TWICE: TO THE READER'S KEY, THEN TO THE PALLIORA GUARDIANS. NEITHER SEAL IS ENOUGH ALONE</text><text x="480" y="513" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">The revoker reads it, or a third party the revoker grants access to. The Palliora DeFi server never sees it.</text>
</svg>
