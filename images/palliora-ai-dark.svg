<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBD5"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBD5"/></marker></defs><rect x="0" y="0" width="1000" height="470" fill="#1E1D18"/><text x="40" y="38" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">PALLIORA AI</text><text x="40" y="64" font-family="Inter" font-size="22" font-weight="700" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Private, accountable compute for AI</text><rect x="40" y="100" width="230" height="120" rx="12" ry="12" fill="#262419" stroke="#ECEBD5" stroke-width="1.5"/><text x="54" y="124" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">AI app or router</text><text x="54" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">calls the Palliora AI SDK</text><text x="54" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">with a prompt, data</text><text x="54" y="177.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">or an agent step</text><rect x="330" y="100" width="300" height="120" rx="12" ry="12" fill="#2B331F" stroke="#ECEBD5" stroke-width="1.5"/><text x="344" y="124" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Guardian with confidential compute</text><text x="344" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">model runs sealed in a TEE</text><text x="344" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">(Intel TDX); prompts and</text><text x="344" y="177.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">data stay private</text><rect x="690" y="100" width="270" height="120" rx="12" ry="12" fill="#3A2A1C" stroke="#ECEBD5" stroke-width="1.5"/><text x="704" y="124" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Result + record</text><text x="704" y="143.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">answer returned privately;</text><text x="704" y="160.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">a Compute Contract records</text><text x="704" y="177.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">what ran, under what terms</text><path d="M 274 160 L 326 160" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 634 160 L 686 160" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><text x="40" y="262" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0.8" style="">PATH</text><rect x="40" y="274" width="290" height="100" rx="12" ry="12" fill="#1C3B33" stroke="#ECEBD5" stroke-width="1.5"/><text x="54" y="298" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Today</text><text x="54" y="317.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">one Guardian runs a small</text><text x="54" y="334.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">model in Intel TDX (demo)</text><path d="M 332 324 L 348 324" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><rect x="350" y="274" width="290" height="100" rx="12" ry="12" fill="#2A2740" stroke="#ECEBD5" stroke-width="1.5"/><text x="364" y="298" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Next</text><text x="364" y="317.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">more Guardians with large-</text><text x="364" y="334.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">model hardware; plug-ins</text><text x="364" y="351.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">for model routers</text><path d="M 642 324 L 658 324" fill="none" stroke="#ECEBD5" stroke-width="1.6" marker-end="url(#arr)"/><rect x="660" y="274" width="290" height="100" rx="12" ry="12" fill="#1E1D18" stroke="#ECEBD5" stroke-width="1.5"/><text x="674" y="298" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">Then</text><text x="674" y="317.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">a market for private and</text><text x="674" y="334.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#ECEBD5" letter-spacing="0" style="">specialised models</text><text x="40" y="412" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#AFAFA0" letter-spacing="0" style="font-style:italic;">Provenance, a verifiable record of what an agent did, is one use of the same record.</text><text x="40" y="434" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#AFAFA0" letter-spacing="0" style="font-style:italic;">SDK first. Customers pay in fiat or stablecoins; PALI works in the background.</text></svg>