<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="0" y="0" width="1000" height="560" fill="#FEFEF3"/><text x="40" y="38" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">ACTORS AND ROLES</text><text x="40" y="64" font-family="Inter" font-size="22" font-weight="700" text-anchor="start" fill="#222222" letter-spacing="0" style="">Who takes part in a Compute Contract</text><text x="40" y="104" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">THE TWO TRANSACTING PARTIES</text><rect x="40" y="116" width="400" height="86" rx="12" ry="12" fill="#EEEDFE" stroke="#222222" stroke-width="1.5"/><text x="54" y="140" font-family="Inter" font-size="16" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Publisher</text><text x="54" y="159.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">uploads data or a Compute Artifact,</text><text x="54" y="176.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">sets the access rules and price</text><rect x="560" y="116" width="400" height="86" rx="12" ry="12" fill="#EEEDFE" stroke="#222222" stroke-width="1.5"/><text x="574" y="140" font-family="Inter" font-size="16" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Retriever</text><text x="574" y="159.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">requests access to data or a result,</text><text x="574" y="176.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">pays the agreed fee</text><path d="M 240 206 L 330 252" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 760 206 L 670 252" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="256" width="920" height="150" rx="12" ry="12" fill="#EAF3DE" stroke="#222222" stroke-width="1.5"/><text x="60" y="280" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">GUARDIAN NETWORK</text><rect x="60" y="292" width="280" height="78" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="74" y="316" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Guardian</text><text x="74" y="335.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">coordinates, holds a key</text><text x="74" y="352.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">share, approves disclosure</text><rect x="360" y="292" width="280" height="78" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="374" y="316" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Compute node</text><text x="374" y="335.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">runs the computation in</text><text x="374" y="352.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">the contract&#x27;s mode</text><rect x="660" y="292" width="280" height="78" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="674" y="316" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Verifier</text><text x="674" y="335.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">checks the result against</text><text x="674" y="352.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">the contract&#x27;s tests</text><text x="500" y="394" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="middle" fill="#666660" letter-spacing="0" style="font-style:italic;">One physical node can play several of these roles.</text><line x1="40" y1="432" x2="960" y2="432" stroke="#666660" stroke-width="1.2" stroke-dasharray="5 5"/><text x="40" y="458" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">SEPARATE TRACK, NOT PART OF ANY SINGLE CONTRACT</text><rect x="40" y="470" width="920" height="66" rx="12" ry="12" fill="#E1F5EE" stroke="#222222" stroke-width="1.5"/><text x="54" y="494" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Validator</text><text x="54" y="513.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">orders transactions and finalizes the coordination ledger (Manas on testnet)</text></svg>