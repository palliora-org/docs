<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<title>Trading with a Private Sub-account</title>
<desc>Five steps. One, a shielded adaptor call funds a new Private Sub-account. Two, the USDC lands in its Hyperliquid perp account. Three, the Sub-account signs its own orders with isolated margin. Four, the money moves from perp to spot and then to HyperEVM. Five, the Sub-account deposits it into the user's main shielded address. The funding and the return are private. The position on Hyperliquid is public.</desc>
<text x="480" y="56" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#4FBE9E" text-anchor="middle" letter-spacing="0.04em">PRIVATE: THE LINK BETWEEN YOU AND THE SUB-ACCOUNT</text><text x="480" y="74" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#AFAFA0" text-anchor="middle">Funding and return both go through your shielded balance, so nothing links them to your wallet.</text><rect x="32" y="120" width="160" height="196" rx="8" fill="#1C3B33" stroke="#4FBE9E" stroke-width="1.5"/><text x="44" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#7A7A6E" text-anchor="start" letter-spacing="0.04em">SHIELDED BALANCE</text><circle cx="172" cy="136" r="10" fill="none" stroke="#7A7A6E" stroke-width="1"/><text x="172" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#7A7A6E" text-anchor="middle">1</text><g transform="translate(112,186) scale(1.25)" fill="none" stroke="#4FBE9E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-6" y="-1" width="12" height="10" rx="2"/><path d="M-3.5,-1 V-4 C-3.5,-7.5 3.5,-7.5 3.5,-4 V-1"/></g><text x="112" y="232" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#ECEBD5" text-anchor="middle">Fund</text><text x="112" y="254" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">A shielded adaptor</text><text x="112" y="268" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">call sends USDC to a</text><text x="112" y="282" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">new Sub-account</text><defs><marker id="k-5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M194,218 L214,218" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-5)"/><rect x="216" y="120" width="160" height="196" rx="8" fill="#3A2A1C" stroke="#E0A542" stroke-width="1.5"/><text x="228" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#7A7A6E" text-anchor="start" letter-spacing="0.04em">HYPERLIQUID</text><circle cx="356" cy="136" r="10" fill="none" stroke="#7A7A6E" stroke-width="1"/><text x="356" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#7A7A6E" text-anchor="middle">2</text><g transform="translate(296,186) scale(1.25)" fill="none" stroke="#E0A542" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-4" width="9" height="8" rx="4"/><rect x="0" y="-4" width="9" height="8" rx="4"/></g><text x="296" y="232" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#ECEBD5" text-anchor="middle">Arrive</text><text x="296" y="254" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">The USDC lands in the</text><text x="296" y="268" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">Sub-account's perp</text><text x="296" y="282" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">account</text><defs><marker id="k-6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M378,218 L398,218" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-6)"/><rect x="400" y="120" width="160" height="196" rx="8" fill="#3A2A1C" stroke="#E0A542" stroke-width="1.5"/><text x="412" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#7A7A6E" text-anchor="start" letter-spacing="0.04em">SUB-ACCOUNT</text><circle cx="540" cy="136" r="10" fill="none" stroke="#7A7A6E" stroke-width="1"/><text x="540" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#7A7A6E" text-anchor="middle">3</text><g transform="translate(480,186) scale(1.25)" fill="#E0A542" stroke="#E0A542" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,-7 L7,0 L-4,7 Z"/></g><text x="480" y="232" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#ECEBD5" text-anchor="middle">Trade</text><text x="480" y="254" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">It signs its own</text><text x="480" y="268" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">orders, with isolated</text><text x="480" y="282" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">margin</text><defs><marker id="k-7" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M562,218 L582,218" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-7)"/><rect x="584" y="120" width="160" height="196" rx="8" fill="#3A2A1C" stroke="#E0A542" stroke-width="1.5"/><text x="596" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#7A7A6E" text-anchor="start" letter-spacing="0.04em">HYPERLIQUID</text><circle cx="724" cy="136" r="10" fill="none" stroke="#7A7A6E" stroke-width="1"/><text x="724" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#7A7A6E" text-anchor="middle">4</text><g transform="translate(664,186) scale(1.25)" fill="none" stroke="#E0A542" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="-9" y1="3" x2="9" y2="3"/><path d="M0,3 V-7"/><path d="M-3.5,-3.5 L0,-7 L3.5,-3.5"/></g><text x="664" y="232" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#ECEBD5" text-anchor="middle">Bring back</text><text x="664" y="254" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">Perp to spot, then to</text><text x="664" y="268" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">HyperEVM</text><defs><marker id="k-8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#55554A" stroke-width="1.2"/></marker></defs><path d="M746,218 L766,218" fill="none" stroke="#55554A" stroke-width="1" marker-end="url(#k-8)"/><rect x="768" y="120" width="160" height="196" rx="8" fill="#1C3B33" stroke="#4FBE9E" stroke-width="1.5"/><text x="780" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#7A7A6E" text-anchor="start" letter-spacing="0.04em">SHIELDED BALANCE</text><circle cx="908" cy="136" r="10" fill="none" stroke="#7A7A6E" stroke-width="1"/><text x="908" y="140" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#7A7A6E" text-anchor="middle">5</text><g transform="translate(848,186) scale(1.25)" fill="none" stroke="#4FBE9E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-6" y="-1" width="12" height="10" rx="2"/><path d="M-3.5,-1 V-4 C-3.5,-7.5 3.5,-7.5 3.5,-4 V-1"/></g><text x="848" y="232" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#ECEBD5" text-anchor="middle">Return</text><text x="848" y="254" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">It deposits into your</text><text x="848" y="268" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#AFAFA0" text-anchor="middle">main shielded address</text><path d="M216,330 L216,340 L744,340 L744,330" fill="none" stroke="#E0A542" stroke-width="1.5"/><text x="480" y="362" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#E0A542" text-anchor="middle" letter-spacing="0.04em">PUBLIC ON HYPERLIQUID: THE SUB-ACCOUNT'S ADDRESS, ORDERS AND POSITION</text><text x="480" y="380" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#AFAFA0" text-anchor="middle">Size, direction, entry, leverage and liquidation price stay attached to that address.</text><rect x="584" y="420" width="344" height="64" rx="6" fill="#262419" stroke="#55554A" stroke-width="1"/><text x="596" y="440" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#7A7A6E" text-anchor="start" letter-spacing="0.04em">ON THE WAY BACK</text><text x="596" y="458" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#AFAFA0" text-anchor="start">If the Sub-account has no gas, it buys a little HYPE</text><text x="596" y="472" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#AFAFA0" text-anchor="start">from the GasStation for a flat fee in USDC.</text>
</svg>
