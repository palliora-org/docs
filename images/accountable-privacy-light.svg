<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="0" y="0" width="1040" height="640" fill="#FEFEF3"/><text x="40" y="38" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">ACCOUNTABLE PRIVACY</text><text x="40" y="64" font-family="Inter" font-size="22" font-weight="700" text-anchor="start" fill="#222222" letter-spacing="0" style="">Private by default. Disclosed only through due process.</text><rect x="40" y="90" width="960" height="66" rx="12" ry="12" fill="#F3F2DE" stroke="#222222" stroke-width="1.5"/><text x="54" y="114" font-family="Inter" font-size="15" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">By default</text><text x="54" y="134.15" font-family="Inter" font-size="13" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">Activity is encrypted. Identity is sealed to a revoker key that no single party can use alone.</text><rect x="40" y="175" width="590" height="435" rx="12" ry="12" fill="#EEEDFE" stroke="#222222" stroke-width="1.5"/><text x="60" y="200" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">PATH A · INVESTIGATION (INVOLUNTARY)</text><rect x="60" y="215" width="550" height="58" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="74" y="239" font-family="Inter" font-size="14" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Signed request</text><text x="74" y="258.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">named requester, scope and reason</text><path d="M 335 275 L 335 291" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="293" width="550" height="58" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="74" y="317" font-family="Inter" font-size="14" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Logged publicly</text><text x="74" y="336.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">the request itself is on the record</text><path d="M 335 353 L 335 369" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="371" width="550" height="58" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="74" y="395" font-family="Inter" font-size="14" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Guardian quorum reviews</text><text x="74" y="414.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">k-of-n must approve  [TODO: k, n]</text><path d="M 335 431 L 335 447" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="449" width="550" height="58" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="74" y="473" font-family="Inter" font-size="14" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Revoker decrypts scope only</text><text x="74" y="492.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">one record, not the whole history</text><path d="M 335 509 L 335 525" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="527" width="550" height="58" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="74" y="551" font-family="Inter" font-size="14" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Answer to the requester</text><text x="74" y="570.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">full audit trail kept</text><rect x="650" y="175" width="350" height="250" rx="12" ry="12" fill="#EAF3DE" stroke="#222222" stroke-width="1.5"/><text x="670" y="200" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">PATH B · VOLUNTARY</text><rect x="670" y="215" width="310" height="64" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="684" y="239" font-family="Inter" font-size="14" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">User shares a view key</text><text x="684" y="258.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">scoped and time-bound</text><path d="M 825 281 L 825 307" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="670" y="309" width="310" height="96" rx="12" ry="12" fill="#FEFEF3" stroke="#222222" stroke-width="1.5"/><text x="684" y="333" font-family="Inter" font-size="14" font-weight="600" text-anchor="start" fill="#222222" letter-spacing="0" style="">Auditor or tax adviser</text><text x="684" y="352.375" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">or a counterparty sees only what</text><text x="684" y="369.25" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">was shared, only for as long</text><text x="684" y="386.125" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">as allowed</text><rect x="650" y="440" width="350" height="170" rx="12" ry="12" fill="#E1F5EE" stroke="#222222" stroke-width="1.5"/><text x="670" y="465" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0.8" style="">WHO HOLDS THE REVOKER ROLE</text><text x="670" y="490" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">Web2 platform: the platform plus an</text><text x="670" y="509" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">independent forensics firm, so the</text><text x="670" y="528" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">platform never holds every key.</text><text x="670" y="547" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">On-chain venue: a guardian quorum.</text><text x="670" y="566" font-family="Inter" font-size="12.5" font-weight="400" text-anchor="start" fill="#222222" letter-spacing="0" style="">[TODO: confirm per product]</text></svg>