<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<title>How Palliora DeFi works</title>
<desc>A swim-lane staircase in three territories. In the EVM network, your device builds and proves a private transaction, a relayer or bundler submits it, and the pool contract checks and records it. Later, only if the transaction must be de-anonymized, the revoker makes a public request in the request record. In the Palliora DeFi guardians and revoker network, each Decom guardian checks the request and sends a partial decryption directly, and a failed check rejects the request. The revoker combines a threshold of partials with its own key and reads the decrypted transaction, then seals a report to the reader's key, its own by default, and publishes it. In Palliora Core, Data Availability keeps the encrypted report, protected by silent threshold encryption and Palliora Guardians. Later, the revoker, or a third party the revoker grants access to, reads it with an access grant.</desc>
<rect x="16" y="72" width="928" height="176" rx="8" fill="#FEFEF3" stroke="#999990" stroke-width="1"/><text x="28" y="84" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#999990" text-anchor="start" letter-spacing="0.05em">EVM NETWORK</text><rect x="16" y="256" width="928" height="124" rx="8" fill="#FEFEF3" stroke="#999990" stroke-width="1"/><text x="28" y="268" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#999990" text-anchor="start" letter-spacing="0.05em">PALLIORA DEFI GUARDIANS AND REVOKER NETWORK</text><rect x="16" y="388" width="928" height="72" rx="8" fill="#FEFEF3" stroke="#0F6E56" stroke-width="1.5"/><text x="28" y="400" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#0F6E56" text-anchor="start" letter-spacing="0.05em">PALLIORA CORE, DATA AVAILABILITY</text><g transform="translate(33,26) scale(0.5416666666666666)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-6" y="-1" width="12" height="10" rx="2"/><path d="M-3.5,-1 V-4 C-3.5,-7.5 3.5,-7.5 3.5,-4 V-1"/></g><text x="46" y="30" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#666660" text-anchor="start">Your device</text><g transform="translate(33,102) scale(0.5416666666666666)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-4" width="9" height="8" rx="4"/><rect x="0" y="-4" width="9" height="8" rx="4"/></g><text x="46" y="106" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#666660" text-anchor="start">Relayer or bundler</text><g transform="translate(33,154) scale(0.5416666666666666)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-5" rx="8" ry="2.6"/><path d="M-8,-5 V2 C-8,3.4 -4.4,4.6 0,4.6 C4.4,4.6 8,3.4 8,2 V-5"/><path d="M-8,-1.5 C-8,-0.1 -4.4,1 0,1 C4.4,1 8,-0.1 8,-1.5"/></g><text x="46" y="158" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#666660" text-anchor="start">Pool contract</text><line x1="22" y1="140" x2="938" y2="140" stroke="#999990" stroke-width="0.6" stroke-dasharray="2,3"/><g transform="translate(33,206) scale(0.5416666666666666)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,-9 H3 L7,-5 V9 H-6 Z"/><path d="M3,-9 V-5 H7"/><path d="M-3,1 L-0.5,3.5 L4,-1.5"/></g><text x="46" y="210" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#666660" text-anchor="start">Public request record</text><line x1="22" y1="192" x2="938" y2="192" stroke="#999990" stroke-width="0.6" stroke-dasharray="2,3"/><g transform="translate(33,286) scale(0.5416666666666666)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-5" r="3.2"/><line x1="-2.7" y1="-2.7" x2="7" y2="7"/><line x1="3" y1="3" x2="3" y2="7"/><line x1="6" y1="6" x2="9" y2="3"/></g><text x="46" y="290" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#666660" text-anchor="start">Revoker</text><g transform="translate(33,338) scale(0.5416666666666666)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-2" r="4.5"/><circle cx="5" cy="-2" r="4.5"/><circle cx="0" cy="5.5" r="4.5"/></g><text x="46" y="342" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#666660" text-anchor="start">Decom guardians</text><line x1="22" y1="324" x2="938" y2="324" stroke="#999990" stroke-width="0.6" stroke-dasharray="2,3"/><g transform="translate(33,418) scale(0.5416666666666666)" fill="none" stroke="#666660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-9 L7,-6 V1 C7,6 3,9 0,10.5 C-3,9 -7,6 -7,1 V-6 Z"/></g><text x="46" y="422" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#666660" text-anchor="start">Palliora Core</text><line x1="22" y1="88" x2="938" y2="88" stroke="#999990" stroke-width="0" /><defs><marker id="k-1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M206,60 L206,114 L226,114" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-1)"/><defs><marker id="k-2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M280,136 L280,166 L300,166" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-2)"/><defs><marker id="k-3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#0F6E56" stroke-width="1.2"/></marker></defs><path d="M354,188 L354,218 L374,218" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#k-3)"/><defs><marker id="k-4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M428,240 L428,350 L448,350" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-4)"/><defs><marker id="k-5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M556,350 L596,350 L596,320" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-5)"/><defs><marker id="k-6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M630,298 L662,298" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-6)"/><defs><marker id="k-7" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M716,320 L716,430 L736,430" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-7)"/><defs><marker id="k-8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#999990" stroke-width="1.2"/></marker></defs><path d="M844,430 L884,430 L884,320" fill="none" stroke="#999990" stroke-width="1" marker-end="url(#k-8)"/><text x="440" y="188" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#0F6E56" text-anchor="start">Later, only if the transaction must be de-anonymized</text><text x="564" y="364" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Failed check:</text><text x="564" y="374" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">request rejected</text><rect x="152" y="16" width="108" height="44" rx="6" fill="#E1F5EE" stroke="#999990" stroke-width="1"/><text x="162" y="33" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Build and prove</text><text x="162" y="44" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Choose notes, make</text><text x="162" y="54" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">the proof</text><circle cx="154" cy="18" r="9" fill="#0F6E56"/><text x="154" y="21.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><rect x="226" y="92" width="108" height="44" rx="6" fill="#FAE8D8" stroke="#999990" stroke-width="1"/><text x="236" y="109" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Submit</text><text x="236" y="120" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Pays gas, sends the</text><text x="236" y="130" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">proof</text><circle cx="228" cy="94" r="9" fill="#0F6E56"/><text x="228" y="97.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><rect x="300" y="144" width="108" height="44" rx="6" fill="#EAF3DE" stroke="#999990" stroke-width="1"/><text x="310" y="161" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Check and record</text><text x="310" y="172" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Proof, nullifiers,</text><text x="310" y="182" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">new notes queued</text><circle cx="302" cy="146" r="9" fill="#0F6E56"/><text x="302" y="149.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><rect x="374" y="196" width="108" height="44" rx="6" fill="#FAE8D8" stroke="#999990" stroke-width="1"/><text x="384" y="213" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Request</text><text x="384" y="224" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Revoker names one</text><text x="384" y="234" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">transaction</text><circle cx="376" cy="198" r="9" fill="#0F6E56"/><text x="376" y="201.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><rect x="448" y="328" width="108" height="44" rx="6" fill="#E1F5EE" stroke="#999990" stroke-width="1"/><text x="458" y="345" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Check and answer</text><text x="458" y="356" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Partial decryption,</text><text x="458" y="366" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">sent directly</text><circle cx="450" cy="330" r="9" fill="#0F6E56"/><text x="450" y="333.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><rect x="522" y="276" width="108" height="44" rx="6" fill="#EEEDFE" stroke="#0F6E56" stroke-width="1.5"/><text x="532" y="293" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Combine and read</text><text x="532" y="304" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Threshold of partials</text><text x="532" y="314" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">plus its key</text><circle cx="524" cy="278" r="9" fill="#0F6E56"/><text x="524" y="281.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text><rect x="662" y="276" width="108" height="44" rx="6" fill="#EEEDFE" stroke="#999990" stroke-width="1"/><text x="672" y="293" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Seal and publish</text><text x="672" y="304" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">To the reader's key,</text><text x="672" y="314" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">paid in PALI</text><circle cx="664" cy="278" r="9" fill="#0F6E56"/><text x="664" y="281.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">7</text><rect x="736" y="408" width="108" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="746" y="425" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Keep</text><text x="746" y="436" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Data Availability,</text><text x="746" y="446" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">encrypted</text><circle cx="738" cy="410" r="9" fill="#0F6E56"/><text x="738" y="413.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">8</text><rect x="810" y="276" width="108" height="44" rx="6" fill="#EEEDFE" stroke="#999990" stroke-width="1"/><text x="820" y="293" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#222222" text-anchor="start">Read later</text><text x="820" y="304" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">Revoker, or a third</text><text x="820" y="314" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#666660" text-anchor="start">party it grants</text><circle cx="812" cy="278" r="9" fill="#0F6E56"/><text x="812" y="281.5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">9</text><rect x="110" y="472" width="740" height="44" rx="8" fill="#F3F2DE" stroke="#0F6E56" stroke-width="1.25"/><text x="480" y="490" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#0F6E56" text-anchor="middle" letter-spacing="0.02em">PUBLIC: nullifiers, new commitments, encrypted memos, the fee, the submitter. HIDDEN: sender, recipient, token, amount</text><text x="480" y="506" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#666660" text-anchor="middle">De-anonymizing a transaction takes the revoker and a threshold of Decom guardians together. Palliora keeps the result.</text>
</svg>
